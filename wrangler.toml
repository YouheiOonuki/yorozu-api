# yorozu-api（Cloudflare Workers）。デプロイはオーナーの Cloudflare アカウントで（README「オーナーの手順」）
name = "yorozu-api"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
# workers.dev の URL（https://yorozu-api.<アカウントのサブドメイン>.workers.dev）で公開する。独自ドメインは K135（DNS を Cloudflare 経由）のあと
workers_dev = true
preview_urls = false

# 入力を保存しない: Workers Logs（console の出力と呼び出しの記録）を使わない。数はダッシュボードの「要求数」だけを見る
[observability]
enabled = false

# アカウントは Workers Paid（2026-11-22〜）。含まれる量を超えた分は課金される。
# 守りは、オーナーが置く spending limit と、下の 1 回の CPU の上限（yorozu-plans ROADMAP 7.263 の D775、7.264 の D797）。
# 50ms: 直近 7 日の 1 回の CPU の最大 11.5ms（2026-11-22 の測り。QUEUE Q-1023）の 4 倍を 10ms の単位に切り上げた数と、下の線 50ms の大きい方
[limits]
cpu_ms = 50
